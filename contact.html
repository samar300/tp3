<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="contact.css" />
    <title>contact</title>
  </head>
  <body>
    <form>
      <fieldset>
        <legend>Conatctez-moi</legend>
        <label> Civilité : </label>
        <label for="Mr"> Monsieur </label>
        <input id="Mr" name="c" type="radio" checked />
        <label for="Ma"> Madame</label>
        <input id="Ma" name="c" type="radio" />
        <label for="Mlle"> Mademoiselle </label>
        <input id="Mlle" name="c" type="radio" />
        <label for="nom" id="l1"> Nom : </label>
        <input
          id="nom"
          name="nom"
          type="text"
          placeholder="Votre nom"
          required
        />
        <label for="prenom" id="l2"> Prénom : </label>
        <input
          id="prenom"
          name="prenom"
          type="text"
          placeholder="Votre prénom"
          required
        />
        <label for="email"> Email : </label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="Votre e-mail"
          required
        />
        <label for="tel"> Téléphone : </label>
        <input
          id="tel"
          name="tel"
          type="tel"
          placeholder="Votre téléphone"
          required
          pattern="^9[0-9]{7}"
        />
        <label for="su"> Sujet : </label>
        <input
          id="su"
          name="su"
          type="text"
          placeholder="Votre sujet"
          required
        />
        <label for="m"> Message : </label>
        <textarea id="m" required></textarea>
        <input type="submit" value="Envoyer" />
        <input type="reset" value="Annuler" />
      </fieldset>
    </form>
  </body>
</html>
